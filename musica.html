<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ musica.titulo }} - Louvemos Digital</title>
    <link re="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url('/static/unnamed.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
        }
        .container-musica {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            margin-bottom: 40px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.7);
        }
        .letra-cifra {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            font-size: 19px;
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #ffca28;
            color: #f8f9fa;
        }
        .btn-tom {
            font-weight: bold;
            font-size: 18px;
            width: 45px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-9 container-musica">
            <a href="/" class="btn btn-outline-light btn-sm mb-4">← Voltar à Lista</a>
            
            <div class="d-flex justify-content-between align-items-center mb-1">
                <h1 class="display-6 fw-bold text-warning">{{ musica.titulo }}</h1>
                <span class="badge bg-secondary fs-6">{{ musica.artista }}</span>
            </div>
            
            <p class="text-white-50">Tom Original: <span class="badge bg-dark border border-warning text-warning">{{ musica.tom }}</span></p>

            <div class="card bg-dark text-white border-secondary mb-4">
                <div class="card-body d-flex align-items-center justify-content-between py-2">
                    <span class="fw-semibold">Transpor Tom da Cifra:</span>
                    <div class="d-flex align-items-center">
                        <a href="/musica/{{ id_musica }}?semitons={{ semitons - 1 }}" class="btn btn-danger btn-sm btn-tom">-</a>
                        <span class="mx-3 fw-bold text-warning fs-5">
                            {% if semitons > 0 %}+{{ semitons }}{% else %}{{ semitons }}{% endif %}
                        </span>
                        <a href="/musica/{{ id_musica }}?semitons={{ semitons + 1 }}" class="btn btn-success btn-sm btn-tom">+</a>
                    </div>
                </div>
            </div>

            <h3 class="h5 text-white-50 mb-3">Letra e Acordes:</h3>
            <div class="letra-cifra">{{ letra_transposta | safe }}</div>
        </div>
    </div>
</div>

</body>
</html>
