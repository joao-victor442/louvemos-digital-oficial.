<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louvemos Digital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url('/static/unnamed.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .container-principal {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 30px;
            margin-top: 50px;
        }
        .item-musica {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            margin-bottom: 10px;
            border-radius: 8px !important;
        }
        .item-musica:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffca28;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 container-principal">
            <h1 class="text-center text-warning mb-4">Louvemos Digital 🎵</h1>
            <div class="list-group">
                {% for id_m, m in musicas.items() %}
                    <a href="/musica/{{ id_m }}" class="list-group-item list-group-item-action item-musica d-flex justify-content-between align-items-center">
                        <div>
                            <strong>{{ m.titulo }}</strong> <small class="text-white-50">- {{ m.artista }}</small>
                        </div>
                        <span class="badge bg-warning text-dark">{{ m.tom }}</span>
                    </a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
