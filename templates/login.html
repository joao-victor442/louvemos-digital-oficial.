<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4 bg-white" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Acesso Restrito</h3>
            <p class="text-muted small">Insira a senha master de administrador</p>
        </div>

        {% if erro %}
            <div class="alert alert-danger text-center small p-2" role="alert">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Senha do Admin:</label>
                <input type="password" name="senha" class="form-control" placeholder="••••••••" required autofocus>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary fw-bold">Entrar</button>
                <a href="/" class="btn btn-outline-secondary btn-sm">Voltar ao Cancioneiro</a>
            </div>
        </form>
    </div>

</body>
</html>
