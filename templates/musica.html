<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ dados_da_musica.titulo }} - Louvemos Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/static/unnamed.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
        }
        .navbar-custom {
            background-color: rgba(15, 12, 32, 0.6) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-custom {
            background: rgba(15, 12, 32, 0.6) !important;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #ffffff !important;
        }
        .cifra-box {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #1a1a2e !important;
            border-radius: 12px;
        }
    </style>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🎵 Louvemos Digital</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/" class="btn btn-outline-light btn-sm shadow-sm">⬅ Voltar para a lista</a>
        </div>

        <div class="p-4 shadow rounded card-custom mb-4">
            <h1 class="display-5 fw-bold text-warning mb-1">{{ dados_da_musica.titulo }}</h1>
            <h4 class="text-white-50 mb-3">Artista: {{ dados_da_musica.artista }}</h4>
            <span class="badge bg-dark text-warning fw-bold mb-3">Tom Original: {{ dados_da_musica.tom }}</span>
            
            {% if eh_admin %}
            <div class="d-flex gap-2 mt-2 border-top border-secondary pt-3">
                <a href="/editar/{{ dados_da_musica.id }}" class="btn btn-sm btn-warning fw-bold text-dark">✏️ Editar Letra/Cifra</a>
                <form action="/deletar/{{ dados_da_musica.id }}" method="POST" onsubmit="return confirm('Tem certeza que deseja apagar permanentemente esta música?');" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger fw-bold">🗑️ Excluir Música</button>
                </form>
            </div>
            {% endif %}
        </div>

        <div class="p-4 shadow cifra-box border">
            <pre style="font-family: 'Courier New', Courier, monospace; font-size: 18px; line-height: 1.8; color: #1a1a2e; overflow-x: auto; white-space: pre-wrap;">{{ dados_da_musica.letra_cifra }}</pre>
        </div>
    </div>

</body>
</html>
