<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Nova Música - Louvemos Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🎵 Louvemos Digital</a>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="mb-3">
            <a href="/" class="btn btn-outline-secondary btn-sm">⬅ Voltar para a lista</a>
        </div>

        <div class="card shadow-sm p-4 bg-white">
            <h2 class="fw-bold text-secondary mb-4">Cadastrar Nova Música</h2>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Título da Música:</label>
                    <input type="text" name="titulo" class="form-control" placeholder="Ex: Noites Traiçoeiras" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Artista / Banda:</label>
                    <input type="text" name="artista" class="form-control" placeholder="Ex: Padre Marcelo Rossi" required>
                </div>

                <div class="mb-3" style="max-width: 150px;">
                    <label class="form-label fw-bold">Tom Original:</label>
                    <input type="text" name="tom" class="form-control" placeholder="Ex: G" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Letra e Cifra Tradicional:</label>
                    <small class="form-text text-muted d-block mb-2">Digite os acordes na linha superior usando espaços para alinhar com a letra embaixo.</small>
                    <textarea name="letra_cifra" class="form-control" rows="10" style="font-family: monospace;" placeholder="G                  Bm&#10;Tenho esperado este momento" required></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">💾 Salvar Música</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
